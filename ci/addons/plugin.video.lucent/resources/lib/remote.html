<!doctype html>
<html lang="{{LANG}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B1119">
<title>Lucent</title>
<style>
:root{--bg:#0B1119;--card:#16212c;--glass:rgba(255,255,255,.10);--t:#fff;--t2:#DCE2E7;--t3:#BDC8D1;--t4:#8F9BA6;--on:#0B1119}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--t);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:28px 20px 60px}
h1{font-size:30px;margin:6px 0 2px}.sub{color:var(--t3);font-size:15px;margin-bottom:20px}
input{width:100%;height:54px;border-radius:16px;border:0;background:var(--glass);color:var(--t);font-size:18px;padding:0 18px;outline:none}
input:focus{box-shadow:0 0 0 2px #fff}
.hit{display:flex;align-items:center;gap:14px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.06);cursor:pointer}
.hit img,.ph{width:62px;height:93px;border-radius:10px;object-fit:cover;background:linear-gradient(160deg,#5d4f7d,#1b2633);flex:none}
.hit b{display:block;font-size:17px}.hit span{color:var(--t3);font-size:14px}
.hero{height:220px;border-radius:20px;background:#1b2633 center/cover;margin:4px 0 16px}
.btn{display:block;width:100%;height:54px;border:0;border-radius:27px;background:var(--glass);color:var(--t);font-size:17px;font-weight:700;margin:0 0 12px}
.btn.f{background:#fff;color:var(--on)}.back{background:none;border:0;color:var(--t3);font-size:16px;padding:0;margin-bottom:12px}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#fff;color:var(--on);padding:12px 20px;border-radius:24px;font-weight:700;display:none}
.plot{color:var(--t2);line-height:1.45;font-size:15px}
</style>
</head>
<body>
<main id="app"></main>
<div class="toast" id="toast"></div>
<script>
const NL = document.documentElement.lang === "nl";
const L = (nl, en) => NL ? nl : en;
const params = new URLSearchParams(location.search);
let code = params.get("code") || localStorage.getItem("lucent.code") || "";
const app = document.getElementById("app");
const esc = s => String(s || "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
function toast(text) { const t = document.getElementById("toast"); t.textContent = text; t.style.display = "block"; setTimeout(() => t.style.display = "none", 2200); }
async function api(path) { const r = await fetch(path + (path.includes("?") ? "&" : "?") + "code=" + encodeURIComponent(code)); if (r.status === 429) { toast(L("Te vaak een foute code. Wacht een minuut.", "Too many wrong codes. Wait a minute.")); throw new Error("wait"); } if (r.status === 403) { askCode(); throw new Error("code"); } return r.json(); }
function askCode() {
  app.innerHTML = `<h1>Lucent</h1><div class="sub">${L("Vul de code in die op de tv staat.", "Enter the code shown on the TV.")}</div>
    <input id="c" inputmode="numeric" maxlength="4" placeholder="1234"><br><br><button class="btn f" id="go">${L("Verbinden", "Connect")}</button>`;
  document.getElementById("go").onclick = () => { code = document.getElementById("c").value.trim(); try { localStorage.setItem("lucent.code", code); } catch (e) {} search(); };
}
let timer;
function search(text = "") {
  app.innerHTML = `<h1>Lucent</h1><div class="sub">${L("Verbonden met je tv", "Connected to your TV")}</div>
    <input id="q" placeholder="${L("Zoek een film of serie", "Search a film or series")}" value="${esc(text)}" autofocus><div id="hits"></div>`;
  const q = document.getElementById("q");
  q.oninput = () => { clearTimeout(timer); timer = setTimeout(() => run(q.value), 350); };
  if (text) run(text);
}
async function run(text) {
  const box = document.getElementById("hits");
  if (!text.trim()) { box.innerHTML = ""; return; }
  const rows = await api("/api/search?q=" + encodeURIComponent(text));
  box.innerHTML = rows.map((r, i) => `<div class="hit" data-i="${i}">${r.poster ? `<img src="${esc(r.poster)}">` : `<div class="ph"></div>`}
    <div><b>${esc(r.title)}</b><span>${r.type === "movie" ? L("Film", "Film") : L("Serie", "Series")}${r.year ? " · " + esc(r.year) : ""}</span></div></div>`).join("");
  box.querySelectorAll(".hit").forEach(el => el.onclick = () => title(rows[el.dataset.i], text));
}
async function title(row, back) {
  const t = await api(`/api/title?type=${row.type}&id=${row.id}`);
  const bits = [t.year, ...(t.genres || []), t.runtime ? t.runtime + " min" : ""].filter(Boolean).join(" · ");
  app.innerHTML = `<button class="back" id="back">‹ ${L("Terug", "Back")}</button><div class="hero" style="background-image:url('${esc(t.fanart)}')"></div>
    <h1>${esc(t.title)}</h1><div class="sub">${esc(bits)}</div>
    <button class="btn f" data-w="play">${row.type === "movie" ? L("Afspelen op de tv", "Play on the TV") : L("Openen op de tv", "Open on the TV")}</button>
    <button class="btn" data-w="watchlist">${L("Op kijklijst", "Add to watchlist")}</button>
    ${row.type === "movie" ? `<button class="btn" data-w="tonight">${L("Klaarzetten voor vanavond", "Get ready for tonight")}</button>` : ""}
    <p class="plot">${esc(t.plot)}</p>`;
  document.getElementById("back").onclick = () => search(back);
  app.querySelectorAll("[data-w]").forEach(b => b.onclick = async () => {
    const r = await fetch("/api/do", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({code, type: row.type, id: row.id, what: b.dataset.w, title: t.title})});
    toast(r.ok ? L("Verstuurd naar de tv", "Sent to the TV") : r.status === 429 ? L("Te vaak een foute code. Wacht een minuut.", "Too many wrong codes. Wait a minute.") : L("Niet gelukt", "Did not work"));
  });
}
if (params.get("code")) { try { localStorage.setItem("lucent.code", code); } catch (e) {} }
code ? search() : askCode();
</script>
</body>
</html>

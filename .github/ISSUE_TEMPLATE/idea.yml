name: Idea / wish
description: Something Lucent could do better or new
labels: ["idea"]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like?
      description: A screenshot of how another skin does it (for example Nimbus or Arctic Fuse) is very welcome.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: When would you use it?

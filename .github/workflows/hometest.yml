name: Lucent Home test
on:
  push:
    branches: [ci-hometest]
    paths: ["ci/**", "xml/**", "scripts/**", ".github/workflows/hometest.yml"]
permissions:
  contents: write
jobs:
  home:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # Kodi 21 from Debian (deb.debian.org, a CDN): no Launchpad, and not the Ubuntu mirrors of the runners,
    # which were unreachable for hours on 2026-11-11
    container: debian:trixie
    strategy:
      fail-fast: false
      matrix:
        variant: [old, new]
        run: [1]
    steps:
      - name: Install Kodi
        timeout-minutes: 20
        run: |
          mkdir -p /tmp/install
          {
            ok=""
            for try in 1 2 3; do
              timeout 180 apt-get update -q -o Acquire::http::Timeout=20 -o Acquire::Retries=2 || echo "update not complete - going on"
              timeout 900 env DEBIAN_FRONTEND=noninteractive apt-get install -y -q -o Acquire::http::Timeout=20 -o Acquire::Retries=3 \
                     git ca-certificates python3 kodi kodi-pvr-iptvsimple xvfb xauth rsync ffmpeg xdotool procps \
                && { ok=1; break; }
              echo "apt try $try failed - again in 20 s"; sleep 20
            done
            [ -n "$ok" ] || echo "Kodi could not be installed"
            dpkg -l kodi kodi-bin | tail -2
            kodi --version 2>&1 | head -3
          } > /tmp/install/log.txt 2>&1
          tail -40 /tmp/install/log.txt
          which kodi
      - uses: actions/checkout@v4
        if: always()
      - name: Keep the install log
        if: always()
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          mkdir -p ci-results; cp /tmp/install/log.txt ci-results/install-${{ matrix.variant }}-${{ matrix.run }}.log 2>/dev/null || true
      - name: Run
        run: bash ci/run.sh ${{ matrix.variant }} ${{ matrix.run }}
      - name: Save results
        if: always()
        run: |
          git config user.name "ci"; git config user.email "ci@example.invalid"
          git add -f ci-results
          git commit -m "CI results ${{ matrix.variant }}-${{ matrix.run }} [skip ci]" || exit 0
          for i in 1 2 3 4 5 6; do git pull --rebase -X theirs -q origin ci-hometest && git push -q origin HEAD:ci-hometest && break; sleep $((RANDOM % 10 + 3)); done

name: Lucent Home test
on:
  push:
    branches: [ci-hometest]
    paths: ["ci/**", "xml/**", "scripts/**", ".github/workflows/hometest.yml"]
permissions:
  contents: write
jobs:
  home:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        variant: [old, new]
        run: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - name: Install Kodi
        run: |
          mkdir -p ci-results
          {
            sudo add-apt-repository -y ppa:team-xbmc/ppa && sudo apt-get update -q && sudo apt-get install -y -q kodi kodi-bin xvfb rsync \
            || { echo "PPA failed - trying Ubuntu's own Kodi"; sudo add-apt-repository -y -r ppa:team-xbmc/ppa; sudo apt-get update -q; sudo apt-get install -y -q kodi xvfb rsync; }
            apt-cache policy kodi kodi-bin
            kodi --version 2>&1 | head -3
          } > ci-results/install-${{ matrix.variant }}-${{ matrix.run }}.log 2>&1
          tail -40 ci-results/install-${{ matrix.variant }}-${{ matrix.run }}.log
          which kodi
      - name: Run
        run: bash ci/run.sh ${{ matrix.variant }} ${{ matrix.run }}
      - name: Save results
        if: always()
        run: |
          git config user.name "ci"; git config user.email "ci@example.invalid"
          git add -f ci-results
          git commit -m "CI results ${{ matrix.variant }}-${{ matrix.run }} [skip ci]" || exit 0
          for i in 1 2 3 4 5 6; do git pull --rebase -q origin ci-hometest && git push -q origin HEAD:ci-hometest && break; sleep $((RANDOM % 10 + 3)); done

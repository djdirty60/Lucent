name: Lucent Home test
on:
  push:
    branches: [ci-hometest]
    paths: ["ci/**", "xml/**", "scripts/**", ".github/workflows/hometest.yml"]
permissions:
  contents: write
jobs:
  home:
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        variant: [old, new]
        run: [1]
    steps:
      - uses: actions/checkout@v4
      # Kodi 21 comes from Ubuntu 26.04 itself: no Launchpad PPA (retired, and very slow). Every apt step has a time limit,
      # because apt on Ubuntu can wait forever after a failed name lookup.
      - name: Install Kodi
        timeout-minutes: 20
        run: |
          mkdir -p ci-results
          {
            ok=""
            for try in 1 2 3; do
              # an unreachable extra source (today security.ubuntu.com) must not stop the install: the mirror has Kodi
              timeout 180 sudo apt-get update -q -o Acquire::http::Timeout=20 -o Acquire::Retries=2 || echo "update not complete - going on"
              timeout 600 sudo apt-get install -y -q -o Acquire::http::Timeout=20 -o Acquire::Retries=3 \
                     kodi kodi-bin kodi-pvr-iptvsimple xvfb rsync ffmpeg xdotool mesa-utils libgl1-mesa-dri \
                && { ok=1; break; }
              echo "apt try $try failed - again in 20 s"; sleep 20
            done
            [ -n "$ok" ] || echo "Kodi could not be installed"
            apt-cache policy kodi kodi-bin
            kodi --version 2>&1 | head -3
          } > ci-results/install-${{ matrix.variant }}-${{ matrix.run }}.log 2>&1
          tail -40 ci-results/install-${{ matrix.variant }}-${{ matrix.run }}.log
          which kodi
      - name: Run
        run: bash ci/run.sh ${{ matrix.variant }} ${{ matrix.run }}
      - name: Save results
        if: always()
        run: |
          git config user.name "ci"; git config user.email "ci@example.invalid"
          git add -f ci-results
          git commit -m "CI results ${{ matrix.variant }}-${{ matrix.run }} [skip ci]" || exit 0
          for i in 1 2 3 4 5 6; do git pull --rebase -X theirs -q origin ci-hometest && git push -q origin HEAD:ci-hometest && break; sleep $((RANDOM % 10 + 3)); done
